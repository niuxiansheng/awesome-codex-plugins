name: Sync Fork main with Upstream

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一 UTC 0 点
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == true
    permissions:
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream changes
        uses: aormsby/fork-sync-with-upstream-action@v3.4.3
        with:
          # 正确的新参数名
          upstream_sync_repo: hashgraph-online/awesome-codex-plugins
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_pull_args: '--allow-unrelated-histories'
